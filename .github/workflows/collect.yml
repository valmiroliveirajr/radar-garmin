name: Coleta diaria Radar Garmin
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/collect.py
      - name: Commit historico
        run: |
          git config user.name "radar-garmin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "coleta diaria Radar Garmin"
          git pull --rebase origin main
          git push origin main
