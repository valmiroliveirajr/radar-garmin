name: Coleta diaria Radar Garmin
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect.py"
      - "scripts/collect_ml_catalog_all.py"
      - "scripts/validate_ml_selection.py"
      - ".github/workflows/collect.yml"
permissions:
  contents: write
jobs:
  collect:
    concurrency:
      group: radar-garmin-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar precos
        env:
          ML_CLIENT_ID: ${{ vars.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: |
          python scripts/collect.py
          python scripts/collect_ml_catalog_all.py
      - name: Validar selecao Mercado Livre
        run: python scripts/validate_ml_selection.py
      - name: Commit historico
        run: |
          git config user.name "radar-garmin-bot"
          git config user.email "actions@users.noreply.github.com"
          git stash push -u -m radar-garmin-data -- data/ || true
          git pull --rebase origin main
          git stash pop || true
          git add data/
          git diff --cached --quiet || git commit -m "coleta diaria Radar Garmin"
          git push origin main
