name: Coleta diaria Radar de Precos
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "data/watchlist.json"
      - "scripts/collect_watchlist.py"
      - "scripts/apply_watchlist_preferences.py"
      - "scripts/rebuild_history.py"
      - "scripts/validate_ml_selection.py"
      - ".github/workflows/collect.yml"
permissions:
  contents: write
jobs:
  collect:
    concurrency:
      group: radar-precos-mercado-livre
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Sincronizar main antes da coleta
        run: |
          git fetch origin main
          git reset --hard origin/main
      - name: Coletar produtos monitorados
        env:
          RADAR_ML_API: https://radar-ml-api.valmirvalray.workers.dev
          RADAR_API_ADMIN_KEY: ${{ secrets.RADAR_API_ADMIN_KEY }}
          ML_CLIENT_ID: ${{ vars.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python scripts/collect_watchlist.py
      - name: Aplicar preferencias da watchlist
        run: python scripts/apply_watchlist_preferences.py
      - name: Reconstruir historico por snapshots
        run: python scripts/rebuild_history.py
      - name: Validar selecao Mercado Livre
        run: python scripts/validate_ml_selection.py
      - name: Validar JSON gerado
        run: |
          python -m json.tool data/latest.json >/dev/null
          python -m json.tool data/history.json >/dev/null
          python -m json.tool data/snapshots/$(date -u -d '3 hours ago' +%F).json >/dev/null
      - name: Commit historico
        run: |
          git config user.name "radar-precos-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "coleta diaria Radar de Precos"
          git push origin main
