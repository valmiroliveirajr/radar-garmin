name: Coleta diaria Radar Garmin
on:
  schedule:
    - cron: "0 11 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scripts/collect.py"
      - ".github/workflows/collect.yml"
permissions:
  contents: write
jobs:
  collect:
    concurrency:
      group: radar-garmin-collector
      cancel-in-progress: false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Coletar precos
        env:
          ML_CLIENT_ID: ${{ vars.ML_CLIENT_ID }}
          ML_CLIENT_SECRET: ${{ secrets.ML_CLIENT_SECRET }}
          ML_ACCESS_TOKEN: ${{ secrets.ML_ACCESS_TOKEN }}
          ML_REFRESH_TOKEN: ${{ secrets.ML_REFRESH_TOKEN }}
        run: python scripts/collect.py
      - name: Commit historico
        run: |
          git config user.name "radar-garmin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || git commit -m "coleta diaria Radar Garmin"
          # Evita conflito com outro run: atualiza a base antes de criar o commit.
          git reset --soft HEAD~1 2>/dev/null || true
          git reset
          git pull --rebase origin main
          git add data/
          git diff --cached --quiet || git commit -m "coleta diaria Radar Garmin"
          git push origin main
