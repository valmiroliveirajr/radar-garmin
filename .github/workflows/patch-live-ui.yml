name: Aplicar oferta ML viva na interface
on:
  push:
    branches: [main]
    paths:
      - "scripts/patch_live_ui.py"
      - ".github/workflows/patch-live-ui.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Atualizar base
        run: git pull --rebase origin main
      - name: Aplicar integração
        run: python scripts/patch_live_ui.py
      - name: Publicar interface
        run: |
          git config user.name "radar-garmin-bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "usar oferta viva do Mercado Livre na interface"
          git push origin main
