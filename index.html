<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Radar ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#16161d;--muted:#656877;--line:#e8e3dc;--purple:#6d28d9;--purple2:#7c3aed;--soft:#f2edff;--green:#15803d;--greenbg:#f0fdf4;--orange:#c2410c;--orangebg:#fff7ed;--red:#b42318;--shadow:0 18px 50px rgba(31,24,18,.07);--sans:Archivo,Arial,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:24px 22px 18px;border-bottom:1px solid var(--line)}.brand-top{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--purple2),#b66cff);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}.side-title{padding:16px 18px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.product-list{padding:0 10px 18px;overflow:auto;display:flex;flex-direction:column;gap:5px}.side-item{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:9px;border-radius:13px;color:var(--ink)}.side-item:hover{background:#f8f5fb}.side-item.active{background:var(--soft)}.side-item img{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line)}.side-item strong{display:block;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}.side-item small{display:block;margin-top:4px;font:600 11px var(--mono);color:var(--muted)}.side-item .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}.side-item .dot.pending{background:#d97706}.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,242,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(232,227,220,.8);padding:15px 26px}.search-row{display:flex;gap:10px;align-items:center;max-width:1120px}.search{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 10px 0 14px;box-shadow:0 4px 18px rgba(0,0,0,.025)}.search input{width:100%;height:45px;border:0;outline:0;background:transparent;color:var(--ink)}.primary,.search button{border:0;border-radius:10px;background:var(--purple);color:#fff;font-weight:700;padding:10px 15px}.primary:hover,.search button:hover{background:#5b21b6}.secondary{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:10px 14px;font-weight:700}.scope{height:45px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 12px;color:var(--ink);font-weight:600}.body{padding:28px;max-width:1320px;margin:0 auto}.empty{background:#fff;border:1px dashed #d9d0c6;border-radius:18px;padding:40px;text-align:center;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.4fr);gap:26px}.media-card,.summary-card,.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.media-card{padding:18px}.main-image{width:100%;height:360px;object-fit:contain;background:#fff;border-radius:15px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:12px}.thumbs button{border:1px solid var(--line);background:#fff;padding:3px;border-radius:9px}.thumbs button.active{border-color:var(--purple)}.thumbs img{width:58px;height:58px;object-fit:contain;display:block}.summary-card{padding:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--purple);font-weight:800}.summary-card h2{font-size:30px;line-height:1.07;margin:7px 0 10px}.catalog{font:600 12px var(--mono);color:var(--muted)}.price-main{font:600 46px var(--mono);letter-spacing:-.04em;margin:26px 0 4px}.seller{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f5f4f2;color:#4e4f58;font-size:11px;font-weight:700}.badge.good{background:var(--greenbg);color:var(--green)}.badge.warn{background:var(--orangebg);color:var(--orange)}.exact{display:inline-flex;margin-top:20px;background:#17171d;color:#fff;padding:12px 15px;border-radius:11px;font-weight:700;font-size:14px}.meta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}.metric{padding:17px}.metric span{font-size:11px;color:var(--muted);display:block;margin-bottom:8px}.metric strong{font:600 18px var(--mono)}
.section{margin-top:24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 12px}.section-head h3{font-size:20px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:0}.compare{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.compare-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-height:154px}.compare-card.best{border-color:#b7dfc2;background:#fbfffc}.compare-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.compare-card .value{font:600 24px var(--mono);margin-top:15px}.compare-card .note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}.pending{color:#9497a1!important;font-size:15px!important;font-family:var(--sans)!important;font-weight:600!important}.panel{padding:20px}.offers{width:100%;border-collapse:collapse;font-size:13px}.offers th,.offers td{padding:11px 9px;text-align:left;border-bottom:1px solid #eeeae5;vertical-align:middle}.offers th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.offers td.price{font:600 13px var(--mono)}.offers tr.selected{background:#f7fff8}.offer-link{color:var(--purple);font-weight:700}.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:15px;overflow:hidden}.attr{background:#fff;padding:13px 15px}.attr span{display:block;font-size:11px;color:var(--muted)}.attr strong{display:block;font-size:13px;margin-top:5px}.toast{position:fixed;right:20px;bottom:20px;max-width:420px;background:#17171d;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:80;font-size:13px}.toast.show{display:block}
.modal-backdrop{position:fixed;inset:0;z-index:60;background:rgba(17,17,24,.58);display:none;align-items:center;justify-content:center;padding:24px}.modal-backdrop.open{display:flex}.modal{width:min(980px,96vw);max-height:90vh;overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 30px 100px rgba(0,0,0,.28);display:flex;flex-direction:column}.modal-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;padding:20px 22px;border-bottom:1px solid var(--line)}.modal-head h2{font-size:21px;margin:0}.modal-head p{font-size:12px;color:var(--muted);margin:5px 0 0}.modal-close{border:0;background:#f5f3f0;width:36px;height:36px;border-radius:50%;font-size:22px}.modal-body{padding:20px 22px;overflow:auto}.modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:15px 22px;border-top:1px solid var(--line);background:#fbfaf8}.result-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.result-card{display:grid;grid-template-columns:92px minmax(0,1fr);gap:14px;text-align:left;border:1px solid var(--line);background:#fff;border-radius:15px;padding:12px}.result-card:hover{border-color:#c4b5fd;background:#fcfbff}.result-card img{width:92px;height:92px;object-fit:contain}.result-card strong{display:block;font-size:14px;line-height:1.3}.result-card small{display:block;margin-top:5px;font:500 10px var(--mono);color:var(--muted)}.mini-attrs{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}.mini-attrs span{font-size:10px;padding:4px 6px;background:#f4f2ef;border-radius:6px;color:#5d5f68}.setup{display:grid;grid-template-columns:260px minmax(0,1fr);gap:22px}.setup-main{width:100%;height:250px;object-fit:contain;border:1px solid var(--line);border-radius:15px}.setup h3{margin:0 0 5px;font-size:21px}.setup .catalog{margin-bottom:18px}.field{margin:16px 0}.field label{display:block;font-size:11px;font-weight:800;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:7px}.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 11px;background:#fff}.image-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.image-pick{border:1px solid var(--line);border-radius:12px;padding:7px;background:#fff;position:relative}.image-pick.selected{border-color:#a78bfa;background:#faf8ff}.image-pick.cover{box-shadow:0 0 0 2px var(--purple) inset}.image-pick img{width:100%;aspect-ratio:1/1;object-fit:contain}.image-actions{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:5px}.image-actions button{border:0;border-radius:7px;padding:6px 4px;font-size:9px;font-weight:800;background:#f2f0ed}.image-actions button.on{background:var(--soft);color:var(--purple)}.status-box{padding:14px;border-radius:12px;background:#f8f6f3;color:var(--muted);font-size:13px}.config-row{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center}.config-row input{height:43px;border:1px solid var(--line);border-radius:10px;padding:0 11px}.hint{font-size:11px;color:var(--muted);line-height:1.5}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:14px 16px}.side-title{display:none}.product-list{flex-direction:row;overflow:auto;padding:10px 12px}.side-item{min-width:210px}.side-foot{display:none}.hero{grid-template-columns:1fr}.main-image{height:300px}.compare{grid-template-columns:repeat(2,minmax(0,1fr))}.meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.setup{grid-template-columns:1fr}.setup-main{height:220px}}
@media(max-width:620px){.topbar{padding:10px}.search-row{display:grid;grid-template-columns:1fr}.scope,.secondary{width:100%}.body{padding:14px}.summary-card h2{font-size:24px}.price-main{font-size:34px}.compare{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr 1fr}.offers-wrap{overflow:auto}.offers{min-width:820px}.attrs{grid-template-columns:1fr}.modal-backdrop{padding:8px}.modal{max-height:96vh}.result-grid{grid-template-columns:1fr}.result-card{grid-template-columns:70px minmax(0,1fr)}.result-card img{width:70px;height:70px}.image-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.modal-foot{flex-wrap:wrap}.modal-foot button{flex:1}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-top"><div class="logo">ML</div><h1>Radar ML</h1></div><p>Monitore qualquer produto do Mercado Livre.</p></div>
    <div class="side-title">Produtos monitorados</div>
    <div class="product-list" id="productList"></div>
    <div class="side-foot">Busca, seleção, imagens, oferta e histórico em um único fluxo.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search-row">
        <div class="search"><span>⌕</span><input id="searchInput" placeholder="Buscar qualquer produto no Mercado Livre"><button id="searchButton">Buscar</button></div>
        <select class="scope" id="originScope" title="Origem aceita"><option value="all">Nacional + internacional</option><option value="national">Somente compra nacional</option></select>
        <button class="secondary" id="settingsButton" type="button">Configurar API</button>
      </div>
    </div>
    <div class="body" id="content"><div class="empty">Carregando produtos monitorados…</div></div>
  </main>
</div>
<div class="modal-backdrop" id="productModal" role="dialog" aria-modal="true">
  <div class="modal">
    <div class="modal-head"><div><h2 id="modalTitle">Adicionar produto</h2><p id="modalSubtitle">Busque e escolha o item exato para monitorar.</p></div><button class="modal-close" id="modalClose" aria-label="Fechar">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const state={data:null,config:null,current:null,imageIndex:0,scope:localStorage.getItem('radarMlScope')||'all',searchResults:[],draft:null};
const $=s=>document.querySelector(s);
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4600)}
function imgOf(p){return p?.cover_image||p?.thumbnail||p?.images?.[0]||''}
function offerOrigin(o){return o?.origin||o?.purchase_origin||'unknown'}
function allowedOffers(p){const all=p?.market_offers||[];if(state.scope==='all')return all;const hasKnown=all.some(o=>['national','international'].includes(offerOrigin(o)));return hasKnown?all.filter(o=>offerOrigin(o)==='national'):all}
function derive(p){const offers=allowedOffers(p);const cash=[...offers].sort((a,b)=>(a.cash_price??a.price??1e15)-(b.cash_price??b.price??1e15))[0]||null;const noInterest=offers.filter(o=>o.installments_interest_free===true&&o.installments_quantity).sort((a,b)=>(a.installments_total??a.price??1e15)-(b.installments_total??b.price??1e15))[0]||null;const withInterest=offers.filter(o=>o.installments_interest_free===false&&o.installments_quantity).sort((a,b)=>(a.installments_total??1e15)-(b.installments_total??1e15))[0]||null;const fastest=offers.filter(o=>Number.isFinite(Number(o.delivery_days))).sort((a,b)=>Number(a.delivery_days)-Number(b.delivery_days))[0]||null;return{cash,noInterest,withInterest,fastest}}
function renderSidebar(){const products=state.data?.products||[];$('#productList').innerHTML=products.map(p=>{const o=p.selected_offer||{};return `<button class="side-item ${p.catalog_product_id===state.current?'active':''}" data-product="${esc(p.catalog_product_id)}"><img src="${esc(imgOf(p))}" alt=""><span><strong>${esc(p.watchlist_name||p.name)}</strong><small>${o.price!=null?brl(o.price):'aguardando coleta'}</small></span><i class="dot ${o.price==null?'pending':''}"></i></button>`}).join('')||'<div class="empty">Nenhum produto monitorado.</div>'}
function comparisonCard(label,o,type){if(!o)return `<div class="compare-card"><div class="label">${label}</div><div class="value pending">Dados ainda não disponíveis</div><div class="note">O radar já está preparado para esse critério.</div></div>`;let value=brl(o.cash_price??o.installments_total??o.price);let note=`${esc(o.seller_nickname||'vendedor')} · ${esc(o.warranty||'garantia não informada')}`;if(type==='noInterest')note=`${o.installments_quantity}x de ${brl(o.installments_amount)} sem juros · ${esc(o.seller_nickname||'')}`;if(type==='withInterest')note=`${o.installments_quantity}x de ${brl(o.installments_amount)} · total ${brl(o.installments_total)} · ${esc(o.seller_nickname||'')}`;if(type==='fastest'){value=`${o.delivery_days} dia${Number(o.delivery_days)===1?'':'s'}`;note=`${brl(o.price)} · ${esc(o.seller_nickname||'')} · ${esc(o.delivery_label||'prazo estimado')}`};return `<div class="compare-card ${type==='cash'?'best':''}"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`}
function renderProduct(){const products=state.data?.products||[];const p=products.find(x=>x.catalog_product_id===state.current)||products[0];if(!p){$('#content').innerHTML='<div class="empty">Nenhum produto monitorado. Use a busca acima para adicionar o primeiro.</div>';renderSidebar();return}state.current=p.catalog_product_id;renderSidebar();const o=p.selected_offer||{};const imgs=p.images||p.gallery_images||[];state.imageIndex=Math.min(state.imageIndex,Math.max(0,imgs.length-1));const d=derive(p);const originKnown=(p.market_offers||[]).some(x=>['national','international'].includes(offerOrigin(x)));const scopeWarn=state.scope==='national'&&!originKnown?'<span class="badge warn">origem ainda não estruturada; ofertas não foram ocultadas</span>':'';const gallery=imgs.length?`<img class="main-image" src="${esc(imgs[state.imageIndex])}" alt="${esc(p.name)}"><div class="thumbs">${imgs.map((src,i)=>`<button class="${i===state.imageIndex?'active':''}" data-img="${i}"><img src="${esc(src)}" alt="foto ${i+1}"></button>`).join('')}</div>`:'<div class="empty">Imagem não disponível</div>';const offers=allowedOffers(p);$('#content').innerHTML=`<div class="hero"><section class="media-card">${gallery}</section><section class="summary-card"><div class="eyebrow">Mercado Livre · catálogo ${esc(p.catalog_product_id)}</div><h2>${esc(p.watchlist_name||p.name)}</h2><div class="catalog">${esc(p.domain_id||'')} ${scopeWarn}</div><div class="price-main">${o.price!=null?brl(o.price):'Aguardando coleta'}</div><div class="seller">${o.seller_nickname?`<strong>${esc(o.seller_nickname)}</strong>`:''}${o.seller_reputation_level?`<span class="badge good">${esc(o.seller_reputation_level)}</span>`:''}${o.power_seller_status?`<span class="badge">MercadoLíder ${esc(o.power_seller_status)}</span>`:''}${o.factory_warranty?'<span class="badge good">garantia de fábrica</span>':''}${o.free_shipping?'<span class="badge">frete grátis</span>':''}</div>${o.url?`<a class="exact" href="${esc(o.url)}" target="_blank" rel="noopener">Abrir anúncio selecionado ↗</a>`:''}<div class="meta-grid"><div class="metric"><span>Ofertas analisadas</span><strong>${p.market?.offer_count??0}</strong></div><div class="metric"><span>Menor preço bruto</span><strong>${p.market?.min_price!=null?brl(p.market.min_price):'—'}</strong></div><div class="metric"><span>Vendedores confiáveis</span><strong>${p.market?.trusted_count??0}</strong></div><div class="metric"><span>Origem aceita</span><strong>${(p.origin_policy||state.scope)==='national'?'Nacional':'Todas'}</strong></div></div></section></div><section class="section"><div class="section-head"><div><h3>Melhores opções de compra</h3><p>À vista, parcelamento e entrega serão comparados com os dados estruturados disponíveis.</p></div></div><div class="compare">${comparisonCard('Melhor à vista',d.cash,'cash')}${comparisonCard('Melhor sem juros',d.noInterest,'noInterest')}${comparisonCard('Melhor com juros',d.withInterest,'withInterest')}${comparisonCard('Entrega mais rápida',d.fastest,'fastest')}</div></section><section class="section"><div class="section-head"><div><h3>Ofertas encontradas</h3><p>${offers.length} ofertas dentro do filtro atual.</p></div></div><div class="panel offers-wrap"><table class="offers"><thead><tr><th>#</th><th>Preço</th><th>Vendedor</th><th>Reputação</th><th>Garantia</th><th>Frete</th><th>Origem</th><th></th></tr></thead><tbody>${offers.map((x,i)=>`<tr class="${x.item_id===o.item_id?'selected':''}"><td>${i+1}</td><td class="price">${brl(x.price)}</td><td>${esc(x.seller_nickname||'—')}</td><td>${esc(x.seller_reputation_level||x.power_seller_status||'—')}</td><td>${esc(x.warranty||'—')}</td><td>${x.free_shipping?'grátis':x.shipping_cost!=null?brl(x.shipping_cost):'—'}</td><td>${offerOrigin(x)==='national'?'nacional':offerOrigin(x)==='international'?'internacional':'não informada'}</td><td><a class="offer-link" href="${esc(x.url||'#')}" target="_blank" rel="noopener">abrir ↗</a></td></tr>`).join('')}</tbody></table></div></section>${(p.attributes||[]).length?`<section class="section"><div class="section-head"><div><h3>Dados do produto</h3><p>Informações estruturadas do catálogo do Mercado Livre.</p></div></div><div class="attrs">${p.attributes.map(a=>`<div class="attr"><span>${esc(a.name||a.id)}</span><strong>${esc(a.value_name||'—')}</strong></div>`).join('')}</div></section>`:''}`}
function openModal(){document.body.style.overflow='hidden';$('#productModal').classList.add('open')}function closeModal(){document.body.style.overflow='';$('#productModal').classList.remove('open');state.draft=null}
function setModal(title,subtitle,body,foot=''){ $('#modalTitle').textContent=title;$('#modalSubtitle').textContent=subtitle;$('#modalBody').innerHTML=body;$('#modalFoot').innerHTML=foot;openModal() }
function apiBase(){return (localStorage.getItem('radarMlApi')||state.config?.admin_api||'').replace(/\/$/,'')}
function adminKey(){return localStorage.getItem('radarMlAdminKey')||''}
function configureApi(){const current=apiBase();const url=prompt('URL HTTPS do backend Radar ML (Cloudflare Worker)',current);if(url===null)return;if(url.trim())localStorage.setItem('radarMlApi',url.trim().replace(/\/$/,''));const key=prompt('Chave administrativa do Radar ML',adminKey());if(key===null)return;if(key.trim())localStorage.setItem('radarMlAdminKey',key.trim());toast('Configuração da API salva neste navegador.')}
async function apiRequest(path,options={}){const base=apiBase();if(!base)throw new Error('Backend ainda não configurado. Clique em “Configurar API”.');let key=adminKey();if(!key){key=(prompt('Chave administrativa do Radar ML')||'').trim();if(key)localStorage.setItem('radarMlAdminKey',key)}if(!key)throw new Error('Chave administrativa não informada.');const headers={...(options.headers||{}),'x-admin-key':key};const r=await fetch(base+path,{...options,headers});const text=await r.text();let data;try{data=JSON.parse(text)}catch{data={error:text}}if(!r.ok)throw new Error(data.error||data.message||`HTTP ${r.status}`);return data}
function searchResultsView(q){const items=state.searchResults;if(!items.length)return `<div class="empty">Nenhum produto de catálogo encontrado para “${esc(q)}”.</div>`;return `<div class="result-grid">${items.map(x=>{const attrs=(x.attributes||[]).filter(a=>a.value_name).slice(0,4);return `<button class="result-card" data-select-catalog="${esc(x.id)}"><img src="${esc(x.thumbnail||x.images?.[0]||'')}" alt=""><div><strong>${esc(x.name||x.id)}</strong><small>${esc(x.id)} · ${esc(x.domain_id||'catálogo ML')}</small><div class="mini-attrs">${attrs.map(a=>`<span>${esc(a.name)}: ${esc(a.value_name)}</span>`).join('')}</div></div></button>`}).join('')}</div>`}
async function searchOnline(){const q=$('#searchInput').value.trim();if(q.length<2){toast('Digite pelo menos 2 caracteres.');return}setModal('Buscando no Mercado Livre',q,'<div class="empty">Consultando o catálogo do Mercado Livre…</div>','<button class="secondary" data-close-modal>Cancelar</button>');try{const data=await apiRequest('/search?q='+encodeURIComponent(q));state.searchResults=data.results||[];setModal('Escolha o produto exato',`${state.searchResults.length} possibilidades encontradas para “${q}”.`,searchResultsView(q),'<button class="secondary" data-close-modal>Cancelar</button>')}catch(e){setModal('Não foi possível pesquisar',e.message,`<div class="status-box">${esc(e.message)}</div>`,`<button class="secondary" data-config-api>Configurar API</button><button class="secondary" data-close-modal>Fechar</button>`)} }
function selectCatalog(pid){const p=state.searchResults.find(x=>x.id===pid);if(!p)return;const images=(p.images||[]).slice(0,10);state.draft={...p,cover_image:p.thumbnail||images[0]||null,gallery_images:images.slice(0,Math.min(6,images.length)),origin_policy:state.scope==='national'?'national':'all'};renderDraft()}
function renderDraft(){const p=state.draft;if(!p)return;const images=p.images||[];const cover=p.cover_image||images[0]||'';const body=`<div class="setup"><div><img class="setup-main" src="${esc(cover)}" alt="${esc(p.name)}"><div class="hint" style="margin-top:10px">A imagem marcada como capa será usada na lista lateral e no destaque do produto.</div></div><div><h3>${esc(p.name)}</h3><div class="catalog">${esc(p.id)} · ${esc(p.domain_id||'catálogo Mercado Livre')}</div><div class="field"><label>Origem aceita</label><select id="draftOrigin"><option value="all" ${p.origin_policy==='all'?'selected':''}>Nacional + internacional</option><option value="national" ${p.origin_policy==='national'?'selected':''}>Somente compra nacional</option></select></div><div class="field"><label>Imagens do produto</label><div class="image-grid">${images.map(src=>{const selected=p.gallery_images.includes(src),isCover=src===p.cover_image;return `<div class="image-pick ${selected?'selected':''} ${isCover?'cover':''}"><img src="${esc(src)}" alt=""><div class="image-actions"><button class="${isCover?'on':''}" data-cover-img="${esc(src)}">${isCover?'Capa':'Usar capa'}</button><button class="${selected?'on':''}" data-toggle-img="${esc(src)}">${selected?'Na galeria':'Adicionar'}</button></div></div>`}).join('')}</div></div><div class="hint">As imagens são referenciadas diretamente do CDN do Mercado Livre; não é necessário baixar nem fazer upload.</div></div></div>`;setModal('Configurar produto','Escolha a capa, a galeria e a política de origem antes de adicionar ao radar.',body,'<button class="secondary" data-back-results>Voltar</button><button class="primary" data-save-product>Adicionar ao Radar</button>')}
function setCover(url){if(!state.draft)return;state.draft.cover_image=url;if(!state.draft.gallery_images.includes(url))state.draft.gallery_images.unshift(url);renderDraft()}
function toggleGallery(url){if(!state.draft)return;const list=state.draft.gallery_images;if(list.includes(url)){if(url===state.draft.cover_image){toast('A imagem de capa também precisa permanecer na galeria.');return}state.draft.gallery_images=list.filter(x=>x!==url)}else if(list.length<10)state.draft.gallery_images=[...list,url];else toast('A galeria aceita até 10 imagens.');renderDraft()}
async function saveDraft(){const p=state.draft;if(!p)return;p.origin_policy=$('#draftOrigin')?.value||p.origin_policy;$('#modalFoot').innerHTML='<button class="primary" disabled>Salvando…</button>';try{const result=await apiRequest('/watchlist',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({catalog_product_id:p.id,name:p.name,cover_image:p.cover_image,gallery_images:p.gallery_images,origin_policy:p.origin_policy})});const entry=result.product;const list=state.data?.products||[];let current=list.find(x=>x.catalog_product_id===entry.catalog_product_id);const optimistic={catalog_product_id:entry.catalog_product_id,name:entry.name,watchlist_name:entry.name,cover_image:entry.cover_image,thumbnail:entry.cover_image,images:entry.gallery_images||[],gallery_images:entry.gallery_images||[],origin_policy:entry.origin_policy,attributes:p.attributes||[],selected_offer:null,market:{offer_count:0,min_price:null,trusted_count:0},market_offers:[],available:false,collected_at:null};if(current)Object.assign(current,optimistic);else list.push(optimistic);state.data.products=list;state.current=entry.catalog_product_id;state.imageIndex=0;closeModal();renderSidebar();renderProduct();toast('Produto adicionado. A coleta automática foi disparada pelo update da watchlist.');pollForProduct(entry.catalog_product_id)}catch(e){toast('Não foi possível adicionar: '+e.message);renderDraft()}}
async function pollForProduct(pid){for(let i=0;i<18;i++){await new Promise(r=>setTimeout(r,7000));try{const r=await fetch('data/latest.json?'+Date.now(),{cache:'no-store'});if(!r.ok)continue;const data=await r.json();const p=(data.products||[]).find(x=>x.catalog_product_id===pid&&x.selected_offer?.price!=null);if(p){state.data=data;state.current=pid;renderSidebar();renderProduct();toast('Primeira coleta concluída e produto atualizado.');return}}catch{}}}
async function load(){try{const [dataR,configR]=await Promise.all([fetch('data/latest.json?'+Date.now(),{cache:'no-store'}),fetch('data/config.json?'+Date.now(),{cache:'no-store'})]);state.data=await dataR.json();state.config=configR.ok?await configR.json():{};const wanted=new URLSearchParams(location.search).get('p');state.current=wanted||(state.data.products?.[0]?.catalog_product_id||null);$('#originScope').value=state.scope;renderSidebar();renderProduct()}catch(e){console.error(e);$('#content').innerHTML='<div class="empty">Não foi possível carregar os dados do radar.</div>'}}
document.addEventListener('click',e=>{const product=e.target.closest('[data-product]');if(product){state.current=product.dataset.product;state.imageIndex=0;history.replaceState(null,'','?p='+encodeURIComponent(state.current));renderProduct();return}const image=e.target.closest('[data-img]');if(image){state.imageIndex=Number(image.dataset.img);renderProduct();return}const sel=e.target.closest('[data-select-catalog]');if(sel){selectCatalog(sel.dataset.selectCatalog);return}const cover=e.target.closest('[data-cover-img]');if(cover){setCover(cover.dataset.coverImg);return}const toggle=e.target.closest('[data-toggle-img]');if(toggle){toggleGallery(toggle.dataset.toggleImg);return}if(e.target.closest('[data-save-product]')){saveDraft();return}if(e.target.closest('[data-back-results]')){setModal('Escolha o produto exato',`${state.searchResults.length} possibilidades encontradas.`,searchResultsView($('#searchInput').value.trim()),'<button class="secondary" data-close-modal>Cancelar</button>');return}if(e.target.closest('[data-config-api]')){closeModal();configureApi();return}if(e.target.closest('[data-close-modal]')||e.target.id==='modalClose'||e.target.id==='productModal'){closeModal();return}});
$('#searchButton').addEventListener('click',searchOnline);$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchOnline()});$('#settingsButton').addEventListener('click',configureApi);$('#originScope').addEventListener('change',e=>{state.scope=e.target.value;localStorage.setItem('radarMlScope',state.scope);renderProduct()});
load();
</script>
</body>
</html>
