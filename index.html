<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6d28d9">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Radar ML</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/radar.css">
</head>
<body>
<div class="mobile-head"><div class="mobile-brand"><div class="logo">ML</div><span>Radar ML</span></div><div class="mobile-status"><i id="mobileStatusDot" class="dot pending"></i><span id="mobileStatusText">conectando</span></div></div>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-top"><div class="logo">ML</div><h1>Radar ML</h1></div><p>Monitore qualquer produto do Mercado Livre.</p></div>
    <div class="side-title">Produtos monitorados</div>
    <div class="product-list" id="productList"></div>
    <div class="side-foot">Busca, seleção, imagens, oferta e histórico em um único fluxo.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search-row">
        <div class="search"><span>⌕</span><input id="searchInput" inputmode="search" autocomplete="off" placeholder="Buscar qualquer produto no Mercado Livre"><button id="searchButton" type="button">Buscar</button></div>
        <select class="scope" id="originScope" title="Origem aceita"><option value="all">Nacional + internacional</option><option value="national">Somente compra nacional</option></select>
        <button class="secondary admin-chip" id="settingsButton" type="button"><i id="adminDot" class="dot pending"></i> Administração</button>
      </div>
    </div>
    <div class="body" id="content"><div class="empty">Carregando produtos monitorados…</div></div>
  </main>
</div>
<nav class="mobile-nav" aria-label="Navegação móvel"><button id="navProducts" type="button"><b>☰</b>Produtos</button><button id="navSearch" type="button"><b>⌕</b>Buscar</button><button id="navAdmin" type="button"><b>⚙</b>Admin</button></nav>
<div class="modal-backdrop" id="productModal" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
  <div class="modal">
    <div class="modal-head"><div><h2 id="modalTitle">Radar ML</h2><p id="modalSubtitle"></p></div><button class="modal-close" id="modalClose" aria-label="Fechar">×</button></div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script src="assets/radar.js" defer></script>
<script src="assets/compat.js" defer></script>
</body>
</html>
