<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Radar ML</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f7f5f2;--card:#fff;--ink:#16161d;--muted:#656877;--line:#e8e3dc;--purple:#6d28d9;--purple2:#7c3aed;--soft:#f2edff;--green:#15803d;--greenbg:#f0fdf4;--orange:#c2410c;--orangebg:#fff7ed;--red:#b42318;--redbg:#fff1f1;--shadow:0 18px 50px rgba(31,24,18,.07);--sans:Archivo,Arial,sans-serif;--mono:'IBM Plex Mono',monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}button,input,select{font:inherit}a{color:inherit;text-decoration:none}.app{min-height:100vh;display:grid;grid-template-columns:300px minmax(0,1fr)}
.side{position:sticky;top:0;height:100vh;background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column}.brand{padding:24px 22px 18px;border-bottom:1px solid var(--line)}.brand-top{display:flex;align-items:center;gap:10px}.logo{width:34px;height:34px;border-radius:11px;background:linear-gradient(145deg,var(--purple2),#b66cff);display:grid;place-items:center;color:#fff;font-weight:800}.brand h1{font-size:20px;margin:0}.brand p{font-size:12px;color:var(--muted);margin:5px 0 0}.side-title{padding:16px 18px 8px;font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--muted);text-transform:uppercase}.product-list{padding:0 10px 18px;overflow:auto;display:flex;flex-direction:column;gap:5px}.side-item{width:100%;display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;border:0;background:transparent;text-align:left;padding:9px;border-radius:13px;cursor:pointer;color:var(--ink)}.side-item:hover{background:#f8f5fb}.side-item.active{background:var(--soft)}.side-item img{width:48px;height:48px;border-radius:10px;object-fit:contain;background:#fff;border:1px solid var(--line)}.side-item strong{display:block;font-size:13px;line-height:1.2;overflow:hidden;text-overflow:ellipsis}.side-item small{display:block;margin-top:4px;font:600 11px var(--mono);color:var(--muted)}.side-item .dot{width:8px;height:8px;border-radius:50%;background:var(--green)}
.side-foot{margin-top:auto;padding:14px 18px;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.main{min-width:0}.topbar{position:sticky;top:0;z-index:20;background:rgba(247,245,242,.93);backdrop-filter:blur(14px);border-bottom:1px solid rgba(232,227,220,.8);padding:15px 26px}.search-row{display:flex;gap:10px;align-items:center;max-width:1080px}.search{flex:1;display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--line);border-radius:13px;padding:0 14px;box-shadow:0 4px 18px rgba(0,0,0,.025)}.search input{width:100%;height:45px;border:0;outline:0;background:transparent;color:var(--ink)}.search button,.primary{border:0;border-radius:12px;background:var(--purple);color:#fff;font-weight:700;padding:12px 17px;cursor:pointer}.search button:hover,.primary:hover{background:#5b21b6}.scope{height:45px;border:1px solid var(--line);background:#fff;border-radius:12px;padding:0 12px;color:var(--ink);font-weight:600}.body{padding:28px;max-width:1320px;margin:0 auto}.empty{background:#fff;border:1px dashed #d9d0c6;border-radius:18px;padding:40px;text-align:center;color:var(--muted)}
.hero{display:grid;grid-template-columns:minmax(280px,.9fr) minmax(0,1.4fr);gap:26px}.media-card,.summary-card,.metric,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.media-card{padding:18px}.main-image{width:100%;height:360px;object-fit:contain;background:#fff;border-radius:15px}.thumbs{display:flex;gap:8px;overflow:auto;margin-top:12px}.thumbs button{border:1px solid var(--line);background:#fff;padding:3px;border-radius:9px;cursor:pointer}.thumbs button.active{border-color:var(--purple)}.thumbs img{width:58px;height:58px;object-fit:contain;display:block}.summary-card{padding:26px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:.13em;color:var(--purple);font-weight:800}.summary-card h2{font-size:30px;line-height:1.07;margin:7px 0 10px}.catalog{font:600 12px var(--mono);color:var(--muted)}.price-main{font:600 46px var(--mono);letter-spacing:-.04em;margin:26px 0 4px}.seller{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13px;color:var(--muted)}.badge{display:inline-flex;align-items:center;padding:5px 8px;border-radius:999px;background:#f5f4f2;color:#4e4f58;font-size:11px;font-weight:700}.badge.good{background:var(--greenbg);color:var(--green)}.badge.warn{background:var(--orangebg);color:var(--orange)}.exact{display:inline-flex;margin-top:20px;background:#17171d;color:#fff;padding:12px 15px;border-radius:11px;font-weight:700;font-size:14px}.meta-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:22px}.metric{padding:17px}.metric span{font-size:11px;color:var(--muted);display:block;margin-bottom:8px}.metric strong{font:600 18px var(--mono)}
.section{margin-top:24px}.section-head{display:flex;align-items:end;justify-content:space-between;gap:20px;margin:0 0 12px}.section-head h3{font-size:20px;margin:0}.section-head p{font-size:12px;color:var(--muted);margin:0}.compare{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}.compare-card{background:#fff;border:1px solid var(--line);border-radius:17px;padding:18px;min-height:154px}.compare-card.best{border-color:#b7dfc2;background:#fbfffc}.compare-card .label{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:800}.compare-card .value{font:600 24px var(--mono);margin-top:15px}.compare-card .note{font-size:12px;color:var(--muted);line-height:1.4;margin-top:8px}.pending{color:#9497a1!important;font-size:15px!important;font-family:var(--sans)!important;font-weight:600!important}.panel{padding:20px}.offers{width:100%;border-collapse:collapse;font-size:13px}.offers th,.offers td{padding:11px 9px;text-align:left;border-bottom:1px solid #eeeae5;vertical-align:middle}.offers th{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}.offers td.price{font:600 13px var(--mono)}.offers tr.selected{background:#f7fff8}.offer-link{color:var(--purple);font-weight:700}.attrs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1px;background:var(--line);border-radius:15px;overflow:hidden}.attr{background:#fff;padding:13px 15px}.attr span{display:block;font-size:11px;color:var(--muted)}.attr strong{display:block;font-size:13px;margin-top:5px}.search-results{position:absolute;left:26px;right:26px;top:70px;max-width:1080px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 24px 70px rgba(0,0,0,.16);padding:10px;display:none;max-height:68vh;overflow:auto}.search-results.open{display:block}.result{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:13px;align-items:center;padding:10px;border-radius:12px}.result:hover{background:#f8f6f3}.result img{width:72px;height:72px;object-fit:contain}.result strong{display:block}.result small{font:500 11px var(--mono);color:var(--muted)}.result button{border:0;background:var(--soft);color:var(--purple);padding:9px 11px;border-radius:9px;font-weight:700;cursor:pointer}.toast{position:fixed;right:20px;bottom:20px;max-width:400px;background:#17171d;color:#fff;padding:13px 16px;border-radius:12px;display:none;z-index:50;font-size:13px}.toast.show{display:block}
@media(max-width:980px){.app{grid-template-columns:1fr}.side{position:relative;height:auto;border-right:0;border-bottom:1px solid var(--line)}.brand{padding:14px 16px}.side-title{display:none}.product-list{flex-direction:row;overflow:auto;padding:10px 12px}.side-item{min-width:210px}.side-foot{display:none}.topbar{top:0}.hero{grid-template-columns:1fr}.main-image{height:300px}.compare{grid-template-columns:repeat(2,minmax(0,1fr))}.meta-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.attrs{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.topbar{padding:10px}.search-row{display:grid;grid-template-columns:1fr}.scope{width:100%}.search-results{left:10px;right:10px;top:124px}.body{padding:14px}.summary-card h2{font-size:24px}.price-main{font-size:34px}.compare{grid-template-columns:1fr}.meta-grid{grid-template-columns:1fr 1fr}.offers-wrap{overflow:auto}.offers{min-width:820px}.attrs{grid-template-columns:1fr}.result{grid-template-columns:56px minmax(0,1fr)}.result img{width:56px;height:56px}.result button{grid-column:2}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="brand"><div class="brand-top"><div class="logo">ML</div><h1>Radar ML</h1></div><p>Preço, vendedor, garantia e histórico.</p></div>
    <div class="side-title">Produtos monitorados</div>
    <div class="product-list" id="productList"></div>
    <div class="side-foot">Os quatro produtos Garmin já cadastrados continuam como itens normais da sua lista.</div>
  </aside>
  <main class="main">
    <div class="topbar">
      <div class="search-row">
        <div class="search"><span>⌕</span><input id="searchInput" placeholder="Buscar qualquer produto no Mercado Livre"><button id="searchButton">Buscar</button></div>
        <select class="scope" id="originScope" title="Origem aceita"><option value="all">Nacional + internacional</option><option value="national">Somente compra nacional</option></select>
      </div>
      <div class="search-results" id="searchResults"></div>
    </div>
    <div class="body" id="content"><div class="empty">Carregando produtos monitorados…</div></div>
  </main>
</div>
<div class="toast" id="toast"></div>
<script>
const state={data:null,config:null,current:null,imageIndex:0,scope:localStorage.getItem('radarMlScope')||'all'};
const $=s=>document.querySelector(s);const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),4200)}
function imgOf(p){return p?.thumbnail||p?.images?.[0]||''}
function offerOrigin(o){return o?.origin||o?.purchase_origin||'unknown'}
function allowedOffers(p){const all=p?.market_offers||[];if(state.scope==='all')return all;return all.filter(o=>offerOrigin(o)==='national')}
function derive(p){const offers=allowedOffers(p);const cash=[...offers].sort((a,b)=>(a.cash_price??a.price??1e15)-(b.cash_price??b.price??1e15))[0]||null;const noInterest=offers.filter(o=>o.installments_interest_free===true&&o.installments_quantity).sort((a,b)=>(a.installments_total??a.price??1e15)-(b.installments_total??b.price??1e15))[0]||null;const withInterest=offers.filter(o=>o.installments_interest_free===false&&o.installments_quantity).sort((a,b)=>(a.installments_total??1e15)-(b.installments_total??1e15))[0]||null;const fastest=offers.filter(o=>Number.isFinite(Number(o.delivery_days))).sort((a,b)=>Number(a.delivery_days)-Number(b.delivery_days))[0]||null;return{cash,noInterest,withInterest,fastest}}
function renderSidebar(){const products=state.data?.products||[];$('#productList').innerHTML=products.map(p=>{const o=p.selected_offer||{};return `<button class="side-item ${p.catalog_product_id===state.current?'active':''}" data-product="${esc(p.catalog_product_id)}"><img src="${esc(imgOf(p))}" alt=""><span><strong>${esc(p.name)}</strong><small>${o.price!=null?brl(o.price):'sem preço'}</small></span><i class="dot"></i></button>`}).join('')||'<div class="empty">Nenhum produto monitorado.</div>'}
function comparisonCard(label,o,type){if(!o)return `<div class="compare-card"><div class="label">${label}</div><div class="value pending">Dados ainda não disponíveis</div><div class="note">O radar já está preparado para esse critério.</div></div>`;let value=brl(o.cash_price??o.installments_total??o.price);let note=`${esc(o.seller_nickname||'vendedor')} · ${esc(o.warranty||'garantia não informada')}`;if(type==='noInterest')note=`${o.installments_quantity}x de ${brl(o.installments_amount)} sem juros · ${esc(o.seller_nickname||'')}`;if(type==='withInterest')note=`${o.installments_quantity}x de ${brl(o.installments_amount)} · total ${brl(o.installments_total)} · ${esc(o.seller_nickname||'')}`;if(type==='fastest'){value=`${o.delivery_days} dia${Number(o.delivery_days)===1?'':'s'}`;note=`${brl(o.price)} · ${esc(o.seller_nickname||'')} · ${esc(o.delivery_label||'prazo estimado')}`};return `<div class="compare-card ${type==='cash'?'best':''}"><div class="label">${label}</div><div class="value">${value}</div><div class="note">${note}</div></div>`}
function renderProduct(){const products=state.data?.products||[];const p=products.find(x=>x.catalog_product_id===state.current)||products[0];if(!p){$('#content').innerHTML='<div class="empty">Nenhum produto monitorado.</div>';return}state.current=p.catalog_product_id;renderSidebar();const o=p.selected_offer||{};const imgs=p.images||[];state.imageIndex=Math.min(state.imageIndex,Math.max(0,imgs.length-1));const d=derive(p);const originKnown=(p.market_offers||[]).some(x=>offerOrigin(x)!=='unknown');const scopeWarn=state.scope==='national'&&!originKnown?'<span class="badge warn">origem nacional/internacional ainda não estruturada</span>':'';const gallery=imgs.length?`<img class="main-image" id="mainImage" src="${esc(imgs[state.imageIndex])}" alt="${esc(p.name)}"><div class="thumbs">${imgs.map((src,i)=>`<button class="${i===state.imageIndex?'active':''}" data-img="${i}"><img src="${esc(src)}" alt="foto ${i+1}"></button>`).join('')}</div>`:'<div class="empty">Imagem não disponível</div>';const offers=allowedOffers(p);$('#content').innerHTML=`
<div class="hero"><section class="media-card">${gallery}</section><section class="summary-card"><div class="eyebrow">Mercado Livre · catálogo ${esc(p.catalog_product_id)}</div><h2>${esc(p.name)}</h2><div class="catalog">${esc(p.domain_id||'')} ${scopeWarn}</div><div class="price-main">${o.price!=null?brl(o.price):'—'}</div><div class="seller"><strong>${esc(o.seller_nickname||'Vendedor')}</strong><span class="badge good">${esc(o.seller_reputation_level||'reputação não informada')}</span>${o.power_seller_status?`<span class="badge">MercadoLíder ${esc(o.power_seller_status)}</span>`:''}${o.factory_warranty?'<span class="badge good">garantia de fábrica</span>':''}${o.free_shipping?'<span class="badge">frete grátis</span>':''}</div>${o.url?`<a class="exact" href="${esc(o.url)}" target="_blank" rel="noopener">Abrir anúncio selecionado ↗</a>`:''}<div class="meta-grid"><div class="metric"><span>Ofertas analisadas</span><strong>${p.market?.offer_count??0}</strong></div><div class="metric"><span>Menor preço bruto</span><strong>${p.market?.min_price!=null?brl(p.market.min_price):'—'}</strong></div><div class="metric"><span>Vendedores confiáveis</span><strong>${p.market?.trusted_count??0}</strong></div><div class="metric"><span>Coleta</span><strong>${p.collected_at?new Date(p.collected_at).toLocaleDateString('pt-BR'):'—'}</strong></div></div></section></div>
<section class="section"><div class="section-head"><div><h3>Melhores opções de compra</h3><p>O filtro de origem escolhido vale para todos os critérios.</p></div></div><div class="compare">${comparisonCard('Melhor à vista',d.cash,'cash')}${comparisonCard('Melhor sem juros',d.noInterest,'noInterest')}${comparisonCard('Melhor com juros',d.withInterest,'withInterest')}${comparisonCard('Entrega mais rápida',d.fastest,'fastest')}</div></section>
<section class="section"><div class="section-head"><div><h3>Ofertas encontradas</h3><p>${offers.length} ofertas dentro do filtro atual.</p></div></div><div class="panel offers-wrap"><table class="offers"><thead><tr><th>#</th><th>Preço</th><th>Vendedor</th><th>Reputação</th><th>Garantia</th><th>Frete</th><th>Origem</th><th></th></tr></thead><tbody>${offers.map((x,i)=>`<tr class="${x.item_id===o.item_id?'selected':''}"><td>${i+1}</td><td class="price">${brl(x.price)}</td><td>${esc(x.seller_nickname||'—')}</td><td>${esc(x.seller_reputation_level||x.power_seller_status||'—')}</td><td>${esc(x.warranty||'—')}</td><td>${x.free_shipping?'grátis':x.shipping_cost!=null?brl(x.shipping_cost):'—'}</td><td>${offerOrigin(x)==='national'?'nacional':offerOrigin(x)==='international'?'internacional':'não informada'}</td><td><a class="offer-link" href="${esc(x.url||'#')}" target="_blank" rel="noopener">abrir ↗</a></td></tr>`).join('')}</tbody></table></div></section>
${(p.attributes||[]).length?`<section class="section"><div class="section-head"><div><h3>Dados do produto</h3><p>Informações estruturadas do catálogo do Mercado Livre.</p></div></div><div class="attrs">${p.attributes.map(a=>`<div class="attr"><span>${esc(a.name||a.id)}</span><strong>${esc(a.value_name||'—')}</strong></div>`).join('')}</div></section>`:''}`}
async function load(){try{const [dataR,configR]=await Promise.all([fetch('data/latest.json?'+Date.now(),{cache:'no-store'}),fetch('data/config.json?'+Date.now(),{cache:'no-store'})]);state.data=await dataR.json();state.config=configR.ok?await configR.json():{};const wanted=new URLSearchParams(location.search).get('p');state.current=wanted||(state.data.products?.[0]?.catalog_product_id||null);$('#originScope').value=state.scope;renderSidebar();renderProduct()}catch(e){console.error(e);$('#content').innerHTML='<div class="empty">Não foi possível carregar os dados do radar.</div>'}}
async function searchOnline(){const q=$('#searchInput').value.trim();if(!q)return;const api=state.config?.admin_api;if(!api){toast('A interface de busca já está pronta. Falta conectar o backend seguro do Mercado Livre para pesquisar e adicionar produtos sem expor credenciais.');return}const box=$('#searchResults');box.classList.add('open');box.innerHTML='<div class="empty">Buscando no Mercado Livre…</div>';try{const r=await fetch(api.replace(/\/$/,'')+'/search?q='+encodeURIComponent(q));if(!r.ok)throw new Error('HTTP '+r.status);const items=await r.json();box.innerHTML=(items.results||items||[]).map(x=>`<div class="result"><img src="${esc(x.thumbnail||x.images?.[0]||'')}" alt=""><div><strong>${esc(x.name||x.id)}</strong><small>${esc(x.id)}</small></div><button data-add="${esc(x.id)}" data-name="${esc(x.name||x.id)}">Monitorar</button></div>`).join('')||'<div class="empty">Nenhum produto encontrado.</div>'}catch(e){box.innerHTML='<div class="empty">Falha ao pesquisar. '+esc(e.message)+'</div>'}}
async function addProduct(id,name){const api=state.config?.admin_api;if(!api)return;const key=localStorage.getItem('radarMlAdminKey')||prompt('Chave administrativa do Radar ML');if(!key)return;localStorage.setItem('radarMlAdminKey',key);try{const r=await fetch(api.replace(/\/$/,'')+'/watchlist',{method:'POST',headers:{'content-type':'application/json','x-admin-key':key},body:JSON.stringify({catalog_product_id:id,name})});if(!r.ok)throw new Error(await r.text());toast('Produto adicionado. A próxima coleta diária passará a monitorá-lo.');$('#searchResults').classList.remove('open')}catch(e){toast('Não foi possível adicionar: '+e.message)}}
document.addEventListener('click',e=>{const p=e.target.closest('[data-product]');if(p){state.current=p.dataset.product;state.imageIndex=0;history.replaceState(null,'','?p='+encodeURIComponent(state.current));renderProduct();return}const im=e.target.closest('[data-img]');if(im){state.imageIndex=Number(im.dataset.img);renderProduct();return}const add=e.target.closest('[data-add]');if(add){addProduct(add.dataset.add,add.dataset.name);return}if(!e.target.closest('.search-results')&&!e.target.closest('.search'))$('#searchResults').classList.remove('open')});
$('#searchButton').addEventListener('click',searchOnline);$('#searchInput').addEventListener('keydown',e=>{if(e.key==='Enter')searchOnline()});$('#originScope').addEventListener('change',e=>{state.scope=e.target.value;localStorage.setItem('radarMlScope',state.scope);renderProduct()});load();
</script>
</body>
</html>
